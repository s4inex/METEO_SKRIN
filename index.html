<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Meteo Skrin">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/4052/4052984.png">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meteo Skrin Topo Dashboard</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1"></script>
    
    <style>
        html, body { 
            margin: 0; 
            padding: 20px; 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: #ffffff; 
            color: #0f172a; 
            overflow-x: hidden;
        }
        .container { max-width: 1000px; margin: 0 auto; position: relative; z-index: 1; }
        
        /* --- Dark Frosted Glass for high contrast on light backgrounds --- */
        .card { 
            background: rgba(15, 23, 42, 0.88); 
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px; 
            border-radius: 16px; 
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.25); 
            margin-bottom: 20px; 
            color: #f8fafc;
        }
        
        h1 { color: #38bdf8; margin-top: 0; font-weight: 600; font-size: 28px; }
        
        /* --- Live Metrics Display Grid --- */
        .live-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin: 20px 0; }
        .metric-box { 
            padding: 15px; 
            border-radius: 8px; 
            color: white; 
            font-weight: bold; 
            text-align: center; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.15); 
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .temp-box { background: rgba(220, 38, 38, 0.9); }
        .hum-box { background: rgba(29, 78, 216, 0.9); }
        .light-box { background: rgba(217, 119, 6, 0.9); }
        .metric-label { font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.9; }
        .metric-value { font-size: 26px; margin-top: 5px; }

        .controls-toolbar { 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            flex-wrap: wrap; 
            margin-bottom: 20px; 
            background: rgba(255, 255, 255, 0.06); 
            padding: 15px; 
            border-radius: 8px; 
            border: 1px solid rgba(255,255,255,0.05);
        }
        .date-picker-container { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; color: #cbd5e1; }
        .date-picker-container input[type="datetime-local"] { 
            padding: 6px 10px; 
            border: 1px solid rgba(255,255,255,0.2); 
            background: rgba(15, 23, 42, 0.6);
            color: #fff;
            border-radius: 4px; 
            font-family: inherit; 
            color-scheme: dark;
        }

        .btn { background: #0284c7; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; transition: background 0.2s; }
        .btn:hover { background: #0369a1; }
        .btn-secondary { background: #059669; }
        .btn-secondary:hover { background: #047857; }
        .btn-muted { background: #4b5563; }
        .btn-muted:hover { background: #374151; }

        #topoCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none; 
        }
    </style>
</head>
<body>

<canvas id="topoCanvas"></canvas>

<div class="container">
    <div class="live-grid">
        <div class="metric-box temp-box">
            <div class="metric-label">Aktuální Teplota</div>
            <div id="live-temp" class="metric-value">-- °C</div>
        </div>
        <div class="metric-box hum-box">
            <div class="metric-label">Aktuální Vlhkost</div>
            <div id="live-hum" class="metric-value">-- %</div>
        </div>
        <div class="metric-box light-box">
            <div class="metric-label">Aktuální Osvětlení</div>
            <div id="live-light" class="metric-value">-- %</div>
        </div>
    </div>

    <div class="card">
        <h1>Meteo Skrin - Cloud Dashboard</h1>
        
        <div class="controls-toolbar">
            <button class="btn" onclick="resetGraphZoom()">Resetovat Výřez</button>
            
            <div class="date-picker-container">
                <label>Od:</label>
                <input type="datetime-local" id="startDate" onchange="filterAndRenderData()">
            </div>
            
            <div class="date-picker-container">
                <label>Do:</label>
                <input type="datetime-local" id="endDate" onchange="filterAndRenderData()">
            </div>

            <button class="btn btn-secondary" onclick="setLast24Hours()">Posledních 24 hodin</button>
            <button class="btn btn-muted" onclick="resetDateFilters()">Zrušit Filtr</button>
        </div>

        <div style="margin-top: 20px; position: relative; height: 450px;">
            <canvas id="cloudChart"></canvas>
        </div>
    </div>
</div>

<script>
    // ==========================================================
    // --- THING_SPEAK HISTORICAL FETCH & DATA HANDLING ---------
    // ==========================================================
    const CHANNEL_ID = "3394684"; 
    let globalFeedsCache = []; 
    let rawDateStrings = []; 

    const dayBandsPlugin = {
        id: 'dayBands',
        beforeDraw: (chart) => {
            const { ctx, chartArea, scales: { x } } = chart;
            if (!x || !chartArea || rawDateStrings.length === 0) return;

            ctx.save();
            let daysGroups = [];
            let currentDayStr = rawDateStrings[0];
            let startIndex = 0;

            for (let i = 1; i < rawDateStrings.length; i++) {
                if (rawDateStrings[i] !== currentDayStr) {
                    daysGroups.push({ day: currentDayStr, start: startIndex, end: i - 1 });
                    currentDayStr = rawDateStrings[i];
                    startIndex = i;
                }
            }
            daysGroups.push({ day: currentDayStr, start: startIndex, end: rawDateStrings.length - 1 });

            const colors = ['rgba(56, 189, 248, 0.08)', 'rgba(254, 240, 138, 0.04)'];

            daysGroups.forEach((group, index) => {
                let left = x.getPixelForValue(group.start);
                let right = x.getPixelForValue(group.end);
                
                const renderLeft = Math.max(left, chartArea.left);
                const renderRight = Math.min(right, chartArea.right);

                if (renderLeft < renderRight) {
                    ctx.fillStyle = colors[index % colors.length];
                    ctx.fillRect(renderLeft, chartArea.top, renderRight - renderLeft, chartArea.bottom - chartArea.top);
                }

                if (index < daysGroups.length - 1) {
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(right, chartArea.top);
                    ctx.lineTo(right, chartArea.bottom);
                    ctx.stroke();
                }

                ctx.font = 'bold 11px sans-serif';
                ctx.textAlign = 'left';

                if (left >= chartArea.left && left <= chartArea.right) {
                    if (chartArea.right - left > 55) {
                        ctx.fillStyle = 'rgba(15, 23, 42, 0.6)';
                        ctx.fillRect(left + 4, chartArea.top + 4, 48, 18);
                        ctx.fillStyle = '#f8fafc';
                        ctx.fillText(group.day, left + 8, chartArea.top + 17);
                    }
                } else if (left < chartArea.left && right > chartArea.left) {
                    if (right - chartArea.left > 55) {
                        ctx.fillStyle = 'rgba(15, 23, 42, 0.6)';
                        ctx.fillRect(chartArea.left + 4, chartArea.top + 4, 48, 18);
                        ctx.fillStyle = '#f8fafc';
                        ctx.fillText(group.day, chartArea.left + 8, chartArea.top + 17);
                    }
                }
            });
            ctx.restore();
        }
    };

    const chartCtx = document.getElementById('cloudChart').getContext('2d');
    const chartObj = new Chart(chartCtx, {
        type: 'line',
        plugins: [dayBandsPlugin], 
        data: { labels: [], datasets: [
            { 
                label: 'Teplota (°C)', 
                data: [], 
                borderColor: '#f87171', 
                backgroundColor: 'rgba(248,113,113,0.05)', 
                yAxisID: 'yTemp',
                tension: 0.25, 
                pointRadius: 1.5,
                pointHoverRadius: 6
            },
            { 
                label: 'Vlhkost (%)', 
                data: [], 
                borderColor: '#38bdf8', 
                backgroundColor: 'rgba(56,189,248,0.03)', 
                yAxisID: 'yHumLight',
                tension: 0.25, 
                pointRadius: 1.5,
                pointHoverRadius: 6
            },
            { 
                label: 'Osvětlení (%)', 
                data: [], 
                borderColor: '#fbbf24', 
                backgroundColor: 'rgba(251,191,36,0.03)', 
                yAxisID: 'yHumLight',
                tension: 0.25, 
                pointRadius: 1.5,
                pointHoverRadius: 6
            }
        ]},
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            scales: {
                x: { 
                    ticks: { color: '#94a3b8' },
                    title: { display: true, text: 'Čas Záznamu', color: '#94a3b8' },
                    grid: { display: false }
                },
                yTemp: { 
                    type: 'linear', 
                    position: 'left', 
                    ticks: { color: '#94a3b8' },
                    title: { display: true, text: 'Teplota (°C)', color: '#94a3b8' },
                    min: 0, max: 50,
                    grid: { color: 'rgba(255,255,255,0.05)' }
                },
                yHumLight: { 
                    type: 'linear', 
                    position: 'right', 
                    ticks: { color: '#94a3b8' },
                    title: { display: true, text: 'Vlhkost / Světlo (%)', color: '#94a3b8' },
                    min: 0, max: 100, 
                    grid: { drawOnChartArea: false } 
                }
            },
            plugins: {
                legend: { labels: { color: '#e2e8f0' } },
                zoom: {
                    pan: { enabled: true, mode: 'x' },
                    zoom: { wheel: { enabled: true, modifierKey: 'ctrl' }, pinch: { enabled: true }, mode: 'x' }
                },
                tooltip: { backgroundColor: 'rgba(15, 23, 42, 0.95)', padding: 10, bodySpacing: 5, cornerRadius: 6 }
            }
        }
    });

    async function loadCloudData() {
        try {
            const response = await fetch(`https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json?days=7`);
            const data = await response.json();
            
            if (data.feeds && data.feeds.length > 0) {
                globalFeedsCache = data.feeds;
                
                if (!document.getElementById('startDate').value) {
                    const firstDate = new Date(globalFeedsCache[0].created_at);
                    const lastDate = new Date(globalFeedsCache[globalFeedsCache.length - 1].created_at);
                    
                    document.getElementById('startDate').value = formatToDateTimeLocal(firstDate);
                    document.getElementById('endDate').value = formatToDateTimeLocal(lastDate);
                }

                filterAndRenderData();
                updateLiveBoxes(globalFeedsCache[globalFeedsCache.length - 1]);
            }
        } catch (err) {
            console.error("Failed to load historical data window:", err);
        }
    }

    function setLast24Hours() {
        const now = new Date();
        const yesterday = new Date(now.getTime() - (24 * 60 * 60 * 1000));
        document.getElementById('startDate').value = formatToDateTimeLocal(yesterday);
        document.getElementById('endDate').value = formatToDateTimeLocal(now);
        filterAndRenderData();
    }

    function filterAndRenderData() {
        const startVal = document.getElementById('startDate').value;
        const endVal = document.getElementById('endDate').value;
        const startTimestamp = startVal ? new Date(startVal).getTime() : 0;
        const endTimestamp = endVal ? new Date(endVal).getTime() : Infinity;

        const labels = []; const temps = []; const hums = []; const lights = [];
        rawDateStrings = []; 

        globalFeedsCache.forEach(feed => {
            const feedTime = new Date(feed.created_at).getTime();
            if (feedTime >= startTimestamp && feedTime <= endTimestamp) {
                const dateObj = new Date(feed.created_at);
                const timeLabel = dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                const dayLabel = dateObj.toLocaleDateString([], {day: '2-digit', month: '2-digit'}) + '.';
                
                labels.push(timeLabel);
                rawDateStrings.push(dayLabel);
                temps.push(feed.field1 ? parseFloat(feed.field1) : null);
                hums.push(feed.field2 ? parseFloat(feed.field2) : null);
                lights.push(feed.field3 ? parseFloat(feed.field3) : null);
            }
        });

        chartObj.data.labels = labels;
        chartObj.data.datasets[0].data = temps;
        chartObj.data.datasets[1].data = hums;
        chartObj.data.datasets[2].data = lights;
        chartObj.update('none');
    }

    function formatToDateTimeLocal(date) {
        const pad = num => String(num).padStart(2, '0');
        return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
    }

    function updateLiveBoxes(latestFeed) {
        if (!latestFeed) return;
        const currentT = latestFeed.field1 ? parseFloat(latestFeed.field1).toFixed(1) : "--";
        const currentH = latestFeed.field2 ? parseFloat(latestFeed.field2).toFixed(1) : "--";
        const currentL = latestFeed.field3 ? parseFloat(latestFeed.field3).toFixed(0) : "--";

        document.getElementById('live-temp').innerText = `${currentT} °C`;
        document.getElementById('live-hum').innerText = `${currentH} %`;
        document.getElementById('live-light').innerText = `${currentL} %`;
    }

    function resetDateFilters() {
        if (globalFeedsCache.length > 0) {
            const firstDate = new Date(globalFeedsCache[0].created_at);
            const lastDate = new Date(globalFeedsCache[globalFeedsCache.length - 1].created_at);
            document.getElementById('startDate').value = formatToDateTimeLocal(firstDate);
            document.getElementById('endDate').value = formatToDateTimeLocal(lastDate);
            filterAndRenderData();
        }
    }

    function resetGraphZoom() { chartObj.resetZoom(); }
    loadCloudData();
    setInterval(loadCloudData, 30000); 

    // ==========================================================
    // --- PROCEDURAL TOPO CONTOUR MAP RENDER ENGINE (WEBGL2) --
    // ==========================================================
    const topoCanvas = document.getElementById('topoCanvas');
    const gl = topoCanvas.getContext('webgl2', { alpha: false });

    if (!gl) { console.error("WebGL2 execution context blocked or unavailable."); }

    // Direct clip space allocation without JS buffer dependencies
    const quadVS = `#version 300 es
        void main() {
            vec2 pos[4] = vec2[](vec2(-1.0,-1.0), vec2(1.0,-1.0), vec2(-1.0,1.0), vec2(1.0,1.0));
            gl_Position = vec4(pos[gl_VertexID], 0.0, 1.0);
        }`;

    const topoFS = `#version 300 es
        precision highp float;
        uniform float u_time;
        uniform vec2 u_resolution;
        out vec4 fragColor;

        float hash(vec3 p) {
            p = fract(p * vec3(443.8975, 397.2973, 491.1871));
            p += dot(p.xyz, p.yzx + 19.19);
            return fract(p.x * p.y * p.z);
        }
        
        float noise(vec3 p) {
            vec3 i = floor(p);
            vec3 f = fract(p);
            f = f*f*(3.0-2.0*f);
            return mix(mix(mix(hash(i+vec3(0,0,0)), hash(i+vec3(1,0,0)), f.x),
                           mix(hash(i+vec3(0,1,0)), hash(i+vec3(1,1,0)), f.x), f.y),
                   mix(mix(hash(i+vec3(0,0,1)), hash(i+vec3(1,0,1)), f.x),
                           mix(hash(i+vec3(0,1,1)), hash(i+vec3(1,1,1)), f.x), f.y), f.z);
        }

        // 4-Octave Fractal Brownian Motion for rich landscape topography
        float fbm(vec3 p) {
            float value = 0.0;
            float amplitude = 0.53;
            vec3 shift = vec3(100.0);
            for (int i = 0; i < 4; i++) {
                value += amplitude * noise(p);
                p = p * 2.05 + shift;
                amplitude *= 0.48;
            }
            return value;
        }

        void main() {
            vec2 uv = gl_FragCoord.xy / u_resolution.xy;
            uv.x *= u_resolution.x / u_resolution.y; // Correct aspect tracking
            
            // Slow evolutionary drift vector
            vec3 noisePos = vec3(uv * 3.2, u_time * 0.035);
            float terrainHeight = fbm(noisePos);
            
            // Set lines distribution frequency (18 distinct height levels)
            float levels = 18.0;
            float targetValue = terrainHeight * levels;
            
            // Generate clean anti-aliased mathematical contour stripes
            float wave = abs(sin(targetValue * 3.14159265));
            float lineThickness = smoothstep(0.0, 0.075, wave); 
            
            // Complete map synthesis (1.0 = White Base, 0.0 = Crisp Ink Stroke)
            vec3 finalColor = vec3(lineThickness);
            
            fragColor = vec4(finalColor, 1.0);
        }`;

    function compileShaderSource(type, src) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, src);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
            console.error(gl.getShaderInfoLog(shader));
            gl.deleteShader(shader);
            return null;
        }
        return shader;
    }

    const vertexShader = compileShaderSource(gl.VERTEX_SHADER, quadVS);
    const fragmentShader = compileShaderSource(gl.FRAGMENT_SHADER, topoFS);
    const renderProgram = gl.createProgram();
    gl.attachShader(renderProgram, vertexShader);
    gl.attachShader(renderProgram, fragmentShader);
    gl.linkProgram(renderProgram);

    const timeLoc = gl.getUniformLocation(renderProgram, "u_time");
    const resLoc = gl.getUniformLocation(renderProgram, "u_resolution");

    function syncCanvasViewport() {
        topoCanvas.width = window.innerWidth;
        topoCanvas.height = window.innerHeight;
        gl.viewport(0, 0, topoCanvas.width, topoCanvas.height);
    }
    window.addEventListener('resize', syncCanvasViewport);
    syncCanvasViewport();

    const renderLoopStart = performance.now();

    function drawTopography() {
        const timestamp = (performance.now() - renderLoopStart) * 0.001;

        gl.useProgram(renderProgram);
        gl.uniform1f(timeLoc, timestamp);
        gl.uniform2f(resLoc, topoCanvas.width, topoCanvas.height);

        // Render directly using hardware vertex processing arrays
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

        requestAnimationFrame(drawTopography);
    }
    drawTopography();
</script>
</body>
</html>
