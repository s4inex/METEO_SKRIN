<!DOCTYPE html>



<html>
<head>
    <meta charset="UTF-8">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="Meteo Skrin">
	<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/4052/4052984.png">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meteo Skrin Cloud Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1"></script>
    
    <style>
        html { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); margin-bottom: 20px; }
        h1 { color: #0066cc; margin-top: 0; font-weight: 600; font-size: 28px; }
        
        /* --- Live Metrics Display Grid --- */
        .live-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin: 20px 0; }
        .metric-box { padding: 15px; border-radius: 8px; color: white; font-weight: bold; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .temp-box { background: #ff4d4d; }
        .hum-box { background: #3399ff; }
        .light-box { background: #ffcc00; color: #333; }
        .metric-label { font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.9; }
        .metric-value { font-size: 26px; margin-top: 5px; }

        /* --- Controls Toolbar --- */
        .controls-toolbar { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; margin-bottom: 20px; background: #eef2f5; padding: 15px; border-radius: 8px; }
        .date-picker-container { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; }
        .date-picker-container input[type="datetime-local"] { padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; }

        .btn { background: #0066cc; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; transition: background 0.2s; }
        .btn:hover { background: #0052a3; }
        .btn-secondary { background: #4caf50; }
        .btn-secondary:hover { background: #43a047; }
        .btn-muted { background: #666; }
        .btn-muted:hover { background: #555; }
    </style>
</head>
<body>

<div class="container">
    <div class="live-grid">
        <div class="metric-box temp-box">
            <div class="metric-label">Aktuální Teplota</div>
            <div id="live-temp" class="metric-value">-- °C</div>
        </div>
        <div class="metric-box hum-box">
            <div class="metric-label">Aktuální Vlhkost</div>
            <div id="live-hum" class="metric-value">-- %</div>
        </div>
        <div class="metric-box light-box">
            <div class="metric-label">Aktuální Osvětlení</div>
            <div id="live-light" class="metric-value">-- %</div>
        </div>
    </div>

    <div class="card">
        <h1>Meteo Skrin - Cloud Dashboard</h1>
        
        <div class="controls-toolbar">
            <button class="btn" onclick="resetGraphZoom()">Resetovat Výřez</button>
            
            <div class="date-picker-container">
                <label>Od:</label>
                <input type="datetime-local" id="startDate" onchange="filterAndRenderData()">
            </div>
            
            <div class="date-picker-container">
                <label>Do:</label>
                <input type="datetime-local" id="endDate" onchange="filterAndRenderData()">
            </div>

            <button class="btn btn-secondary" onclick="setLast24Hours()">Posledních 24 hodin</button>
            <button class="btn btn-muted" onclick="resetDateFilters()">Zrušit Filtr</button>
        </div>

        <div style="margin-top: 20px; position: relative; height: 450px;">
            <canvas id="cloudChart"></canvas>
        </div>
    </div>
</div>

<script>
    // --- Setup Channel Configurations ---
    const CHANNEL_ID = "3394684"; 
    let globalFeedsCache = []; 
    let rawDateStrings = []; 

    // Custom Chart.js plugin to draw high-saturation, distinct day bands
    const dayBandsPlugin = {
        id: 'dayBands',
        beforeDraw: (chart) => {
            const { ctx, chartArea, scales: { x } } = chart;
            if (!x || !chartArea || rawDateStrings.length === 0) return;

            ctx.save();

            let daysGroups = [];
            let currentDayStr = rawDateStrings[0];
            let startIndex = 0;

            for (let i = 1; i < rawDateStrings.length; i++) {
                if (rawDateStrings[i] !== currentDayStr) {
                    daysGroups.push({ day: currentDayStr, start: startIndex, end: i - 1 });
                    currentDayStr = rawDateStrings[i];
                    startIndex = i;
                }
            }
            daysGroups.push({ day: currentDayStr, start: startIndex, end: rawDateStrings.length - 1 });

            // CHANGED: High-contrast, saturated alternating colors (Sky Blue vs Bright Yellow-Gold)
            const colors = ['rgba(179, 229, 252, 0.45)', 'rgba(255, 249, 196, 0.5)'];

            daysGroups.forEach((group, index) => {
                let left = x.getPixelForValue(group.start);
                let right = x.getPixelForValue(group.end);
                
                const renderLeft = Math.max(left, chartArea.left);
                const renderRight = Math.min(right, chartArea.right);

                if (renderLeft < renderRight) {
                    ctx.fillStyle = colors[index % colors.length];
                    ctx.fillRect(renderLeft, chartArea.top, renderRight - renderLeft, chartArea.bottom - chartArea.top);
                }

                // Day separator line
                if (index < daysGroups.length - 1) {
                    ctx.strokeStyle = 'rgba(0, 0, 0, 0.18)';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(right, chartArea.top);
                    ctx.lineTo(right, chartArea.bottom);
                    ctx.stroke();
                }

                // Render corner date labels
                ctx.fillStyle = '#111111'; // Dark text color for solid readability
                ctx.font = 'bold 12px sans-serif';
                ctx.textAlign = 'left';

                if (left >= chartArea.left && left <= chartArea.right) {
                    if (chartArea.right - left > 55) {
                        ctx.fillStyle = 'rgba(255,255,255,0.8)';
                        ctx.fillRect(left + 4, chartArea.top + 4, 48, 18);
                        ctx.fillStyle = '#111111';
                        ctx.fillText(group.day, left + 8, chartArea.top + 17);
                    }
                } else if (left < chartArea.left && right > chartArea.left) {
                    if (right - chartArea.left > 55) {
                        ctx.fillStyle = 'rgba(255,255,255,0.8)';
                        ctx.fillRect(chartArea.left + 4, chartArea.top + 4, 48, 18);
                        ctx.fillStyle = '#111111';
                        ctx.fillText(group.day, chartArea.left + 8, chartArea.top + 17);
                    }
                }
            });

            ctx.restore();
        }
    };

    const ctx = document.getElementById('cloudChart').getContext('2d');
    const chartObj = new Chart(ctx, {
        type: 'line',
        plugins: [dayBandsPlugin], 
        data: { labels: [], datasets: [
            { 
                label: 'Teplota (°C)', 
                data: [], 
                borderColor: '#ff3333', 
                backgroundColor: 'rgba(255,51,51,0.08)', 
                yAxisID: 'yTemp',
                tension: 0.3, 
                pointRadius: 2,
                pointHoverRadius: 6
            },
            { 
                label: 'Vlhkost (%)', 
                data: [], 
                borderColor: '#0066cc', 
                backgroundColor: 'rgba(0,102,204,0.05)', 
                yAxisID: 'yHumLight',
                tension: 0.3, 
                pointRadius: 2,
                pointHoverRadius: 6
            },
            { 
                label: 'Osvětlení (%)', 
                data: [], 
                borderColor: '#ffcc00', 
                backgroundColor: 'rgba(255,204,0,0.05)', 
                yAxisID: 'yHumLight',
                tension: 0.3, 
                pointRadius: 2,
                pointHoverRadius: 6
            }
        ]},
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: {
                mode: 'index',
                intersect: false, 
            },
            scales: {
                x: { 
                    title: { display: true, text: 'Čas Záznamu' },
                    grid: { display: false }
                },
                yTemp: { 
                    type: 'linear', 
                    position: 'left', 
                    title: { display: true, text: 'Teplota (°C)' },
                    min: 0,
                    max: 50
                },
                yHumLight: { 
                    type: 'linear', 
                    position: 'right', 
                    title: { display: true, text: 'Vlhkost / Světlo (%)' },
                    min: 0, 
                    max: 100, 
                    grid: { drawOnChartArea: false } 
                }
            },
            plugins: {
                zoom: {
                    pan: { enabled: true, mode: 'x' },
                    zoom: {
                        wheel: { enabled: true, modifierKey: 'ctrl' },
                        pinch: { enabled: true },
                        mode: 'x', 
                    }
                },
                tooltip: {
                    backgroundColor: 'rgba(0, 0, 0, 0.8)',
                    padding: 10,
                    bodySpacing: 5,
                    cornerRadius: 6
                }
            }
        }
    });

    async function loadCloudData() {
        try {
            const response = await fetch(`https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json?days=7`);
            const data = await response.json();
            
            if (data.feeds && data.feeds.length > 0) {
                globalFeedsCache = data.feeds;
                
                if (!document.getElementById('startDate').value) {
                    const firstDate = new Date(globalFeedsCache[0].created_at);
                    const lastDate = new Date(globalFeedsCache[globalFeedsCache.length - 1].created_at);
                    
                    document.getElementById('startDate').value = formatToDateTimeLocal(firstDate);
                    document.getElementById('endDate').value = formatToDateTimeLocal(lastDate);
                }

                filterAndRenderData();
                updateLiveBoxes(globalFeedsCache[globalFeedsCache.length - 1]);
            }
        } catch (err) {
            console.error("Failed to load historical data window:", err);
        }
    }

    function setLast24Hours() {
        const now = new Date();
        const yesterday = new Date(now.getTime() - (24 * 60 * 60 * 1000));

        document.getElementById('startDate').value = formatToDateTimeLocal(yesterday);
        document.getElementById('endDate').value = formatToDateTimeLocal(now);
        
        filterAndRenderData();
    }

    function filterAndRenderData() {
        const startVal = document.getElementById('startDate').value;
        const endVal = document.getElementById('endDate').value;

        const startTimestamp = startVal ? new Date(startVal).getTime() : 0;
        const endTimestamp = endVal ? new Date(endVal).getTime() : Infinity;

        const labels = [];
        const temps = [];
        const hums = [];
        const lights = [];
        rawDateStrings = []; 

        globalFeedsCache.forEach(feed => {
            const feedTime = new Date(feed.created_at).getTime();
            
            if (feedTime >= startTimestamp && feedTime <= endTimestamp) {
                const dateObj = new Date(feed.created_at);
                
                const timeLabel = dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                const dayLabel = dateObj.toLocaleDateString([], {day: '2-digit', month: '2-digit'}) + '.';
                
                labels.push(timeLabel);
                rawDateStrings.push(dayLabel);
                
                temps.push(feed.field1 ? parseFloat(feed.field1) : null);
                hums.push(feed.field2 ? parseFloat(feed.field2) : null);
                lights.push(feed.field3 ? parseFloat(feed.field3) : null);
            }
        });

        chartObj.data.labels = labels;
        chartObj.data.datasets[0].data = temps;
        chartObj.data.datasets[1].data = hums;
        chartObj.data.datasets[2].data = lights;
        chartObj.update('none');
    }

    function formatToDateTimeLocal(date) {
        const pad = num => String(num).padStart(2, '0');
        return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
    }

    function updateLiveBoxes(latestFeed) {
        if (!latestFeed) return;
        const currentT = latestFeed.field1 ? parseFloat(latestFeed.field1).toFixed(1) : "--";
        const currentH = latestFeed.field2 ? parseFloat(latestFeed.field2).toFixed(1) : "--";
        const currentL = latestFeed.field3 ? parseFloat(latestFeed.field3).toFixed(0) : "--";

        document.getElementById('live-temp').innerText = `${currentT} °C`;
        document.getElementById('live-hum').innerText = `${currentH} %`;
        document.getElementById('live-light').innerText = `${currentL} %`;
    }

    function resetDateFilters() {
        if (globalFeedsCache.length > 0) {
            const firstDate = new Date(globalFeedsCache[0].created_at);
            const lastDate = new Date(globalFeedsCache[globalFeedsCache.length - 1].created_at);
            
            document.getElementById('startDate').value = formatToDateTimeLocal(firstDate);
            document.getElementById('endDate').value = formatToDateTimeLocal(lastDate);
            filterAndRenderData();
        }
    }

    function resetGraphZoom() {
        chartObj.resetZoom();
    }

    loadCloudData();
    setInterval(loadCloudData, 30000); 
</script>
</body>
</html>
