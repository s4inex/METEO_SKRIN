<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GREEN SKŘÍŇ">
    <link class="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/4052/4052984.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GREEN SKŘÍŇ</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1"></script>
    
    <style>
        /* CSS RESET FOR BOX MODEL - Prevents elements from breaking out of width boundaries */
        *, *:before, *:after {
            box-sizing: border-box;
        }

        html, body { 
            margin: 0; 
            padding: 20px; 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: #ffffff; 
            color: #0f172a; 
            overflow-x: hidden;
            width: 100%;
            -webkit-tap-highlight-color: transparent;
        }
        
        .container { 
            width: 100%;
            max-width: 1200px; 
            margin: 0 auto; 
            position: relative; 
            z-index: 1; 
        }
        
        .card { 
            background: rgba(255, 255, 255, 0.45); 
            backdrop-filter: blur(20px) saturate(200%);
            -webkit-backdrop-filter: blur(20px) saturate(200%);
            border: 1px solid rgba(15, 23, 42, 0.25);
            padding: 25px; 
            border-radius: 16px; 
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.2); 
            margin-bottom: 20px; 
            color: #0f172a;
            width: 100%;
        }
        
        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 15px;
        }

        h1 { color: #0284c7; margin: 0; font-weight: 600; font-size: 28px; }
        
        .plant-ribbon {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.35);
            padding: 10px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            width: 100%;
        }
        .plant-ribbon:hover {
            background: rgba(16, 185, 129, 0.22);
            transform: translateY(-1px);
        }
        .plant-ribbon-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #065f46;
        }
        .plant-ribbon-values {
            display: flex;
            align-items: center;
            gap: 15px;
            color: #0f172a;
        }
        .plant-main-day { font-size: 18px; }
        .plant-sub-week { font-size: 14px; color: #059669; background: rgba(5, 150, 105, 0.12); padding: 2px 8px; border-radius: 4px; font-weight: 600; }
        .plant-sub-day { font-size: 13px; font-weight: normal; color: #334155; }

        .live-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 15px; 
            margin: 20px 0; 
            width: 100%;
        }
        
        .metric-box { 
            padding: 15px; 
            border-radius: 8px; 
            font-weight: bold; 
            text-align: center; 
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.15); 
            backdrop-filter: blur(20px) saturate(200%);
            -webkit-backdrop-filter: blur(20px) saturate(200%);
            color: #0f172a;
            border: 1px solid rgba(15, 23, 42, 0.3);
        }
        
        .temp-box { background: rgba(239, 68, 68, 0.2); }
        .hum-box { background: rgba(37, 99, 235, 0.18); }
        .light-box { background: rgba(245, 158, 11, 0.22); }
        .soil-box { background: rgba(16, 185, 129, 0.22); }
        
        .metric-label { font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; color: #1e293b; }
        .metric-value { font-size: 26px; margin-top: 5px; }

        .dashboard-split-wrapper {
            display: flex;
            flex-direction: row;
            gap: 20px;
            align-items: flex-start;
            width: 100%;
        }
        .main-chart-pane {
            flex: 7; 
            min-width: 0; 
        }
        .side-analytics-pane {
            flex: 3; 
            min-width: 280px;
            position: sticky;
            top: 20px;
        }

        .stat-block-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 15px;
        }
        .stat-group-card {
            border-left: 4px solid #ef4444;
            background: rgba(15, 23, 42, 0.04);
            padding: 12px;
            border-radius: 0 8px 8px 0;
        }
        .stat-group-card.group-hum {
            border-left-color: #2563eb;
        }
        .stat-group-header {
            font-size: 13px;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }
        .stat-item-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            padding: 4px 0;
            border-bottom: 1px dashed rgba(15, 23, 42, 0.08);
        }
        .stat-item-row:last-child {
            border-bottom: none;
        }
        .stat-item-label { color: #475569; }
        .stat-item-value { font-weight: 600; color: #0f172a; }

        .controls-toolbar { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            flex-wrap: wrap; 
            margin-bottom: 20px; 
            background: rgba(255, 255, 255, 0.5); 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid rgba(15, 23, 42, 0.15);
            width: 100%;
        }
        .date-picker-container { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: #0f172a; }
        .date-picker-container input[type="datetime-local"],
        .date-picker-container input[type="date"] { 
            padding: 6px 8px; 
            border: 1px solid rgba(15, 23, 42, 0.3); 
            background: rgba(255, 255, 255, 0.9);
            color: #0f172a;
            border-radius: 4px; 
            font-family: inherit; 
            font-size: 13px;
        }

        .btn { background: #0284c7; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; transition: background 0.2s; }
        .btn:hover { background: #0369a1; }
        .btn-secondary { background: #059669; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; transition: background 0.2s; }
        .btn-secondary:hover { background: #047857; }
        .btn-muted { background: #4b5563; }
        .btn-muted:hover { background: #374151; }

        .modal-backdrop {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(8px);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .modal-window {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            border: 1px solid rgba(15, 23, 42, 0.2);
            width: 90%;
            max-width: 400px;
        }
        .modal-title { font-size: 18px; font-weight: bold; color: #0284c7; margin-bottom: 15px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }

        #topoCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none; 
            transition: opacity 0.5s ease;
        }

        /* --- MOBILE OPTIMIZATIONS FIXED --- */
        @media (max-width: 768px) {
            body { padding: 10px; } /* Reduced uniform padding avoids cutting panels off */
            h1 { font-size: 22px; text-align: center; width: 100%; }
            .card { padding: 15px; border-radius: 12px; margin-bottom: 12px; }
            .live-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 10px 0; }
            .metric-label { font-size: 11px; }
            .metric-value { font-size: 20px; }
            .dashboard-split-wrapper { flex-direction: column; gap: 12px; }
            .main-chart-pane, .side-analytics-pane { width: 100%; flex: none; min-width: 0; }
            .side-analytics-pane { position: static; }
            .controls-toolbar { padding: 8px; gap: 6px; justify-content: center; }
            .date-picker-container { width: 100%; justify-content: space-between; }
            .date-picker-container input { flex-grow: 1; max-width: 70%; }
            .btn, .btn-secondary, .btn-muted { flex-grow: 1; text-align: center; padding: 10px 5px; font-size: 11px; }
            .plant-ribbon { padding: 8px 12px; margin-bottom: 12px; }
            .plant-ribbon-title { font-size: 12px; }
            .plant-main-day { font-size: 15px; }
            .plant-sub-week { font-size: 12px; padding: 1px 5px; }
            div[style*="height: 420px;"] { height: 300px !important; }
        }

        @media (max-width: 360px) {
            .live-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<canvas id="topoCanvas"></canvas>

<div class="container">
    <div class="live-grid">
        <div class="metric-box temp-box">
            <div class="metric-label">Aktuální Teplota</div>
            <div id="live-temp" class="metric-value">-- °C</div>
        </div>
        <div class="metric-box hum-box">
            <div class="metric-label">Aktuální Vlhkost</div>
            <div id="live-hum" class="metric-value">-- %</div>
        </div>
        <div class="metric-box light-box">
            <div class="metric-label">Aktuální Osvětlení</div>
            <div id="live-light" class="metric-value">-- %</div>
        </div>
        <div class="metric-box soil-box">
            <div class="metric-label">Vlhkost půdy</div>
            <div id="live-soil" class="metric-value">-- %</div>
        </div>
    </div>

    <div class="dashboard-split-wrapper">
        
        <div class="main-chart-pane card">
            <div class="header-area">
                <h1>GREEN SKŘÍŇ</h1>
            </div>
            
            <div class="plant-ribbon" onclick="openPlantingModal()" title="Kliknutím změníte datum výsevu">
                <div class="plant-ribbon-title">
                    <span>Stáří rostliny:</span>
                </div>
                <div class="plant-ribbon-values">
                    <span id="live-plant-days" class="plant-main-day">--</span>
                    <span id="live-plant-weeks" class="plant-sub-week" style="display: none;">--</span>
                    <span id="live-plant-total" class="plant-sub-day"></span>
                </div>
            </div>
            
            <div class="controls-toolbar">
                <button class="btn" onclick="resetGraphZoom()">Reset</button>
                
                <div class="date-picker-container">
                    <label>Od:</label>
                    <input type="datetime-local" id="startDate" onchange="filterAndRenderData()">
                </div>
                
                <div class="date-picker-container">
                    <label>Do:</label>
                    <input type="datetime-local" id="endDate" onchange="filterAndRenderData()">
                </div>

                <button class="btn btn-secondary" onclick="setQuickRange(1)">1 den</button>
                <button class="btn btn-secondary" onclick="setQuickRange(3)">3 dny</button>
                <button class="btn btn-secondary" onclick="setQuickRange(7)">Týden</button>
                <button class="btn btn-muted" onclick="resetDateFilters()">Zrušit</button>
            </div>

            <div style="position: relative; height: 420px;">
                <canvas id="cloudChart"></canvas>
            </div>
        </div>

        <div class="side-analytics-pane card" style="padding: 20px;">
            <div style="font-size: 14px; font-weight: bold; color: #1e293b; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid rgba(15,23,42,0.1); padding-bottom: 8px;">📊 Analýza období</div>
            
            <div class="stat-block-container">
                <div class="stat-group-card">
                    <div class="stat-group-header" style="color: #b91c1c;">
                        <span>Teplota vzduchu</span>
                        <span>°C</span>
                    </div>
                    <div class="stat-item-row">
                        <span class="stat-item-label">Minimum</span>
                        <span id="stat-min-temp" class="stat-item-value">-- °C</span>
                    </div>
                    <div class="stat-item-row">
                        <span class="stat-item-label">Průměr</span>
                        <span id="stat-avg-temp" class="stat-item-value">-- °C</span>
                    </div>
                    <div class="stat-item-row">
                        <span class="stat-item-label">Maximum</span>
                        <span id="stat-max-temp" class="stat-item-value">-- °C</span>
                    </div>
                </div>

                <div class="stat-group-card group-hum">
                    <div class="stat-group-header" style="color: #1d4ed8;">
                        <span>Relativní vlhkost</span>
                        <span>%</span>
                    </div>
                    <div class="stat-item-row">
                        <span class="stat-item-label">Minimum</span>
                        <span id="stat-min-hum" class="stat-item-value">-- %</span>
                    </div>
                    <div class="stat-item-row">
                        <span class="stat-item-label">Průměr</span>
                        <span id="stat-avg-hum" class="stat-item-value">-- %</span>
                    </div>
                    <div class="stat-item-row">
                        <span class="stat-item-label">Maximum</span>
                        <span id="stat-max-hum" class="stat-item-value">-- %</span>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<div id="plantingModal" class="modal-backdrop">
    <div class="modal-window">
        <div class="modal-title">Datum zasazení semínka</div>
        <div class="date-picker-container" style="flex-direction: column; align-items: flex-start;">
            <label style="margin-bottom: 5px;">Vyberte den výsevu:</label>
            <input type="date" id="seedPlantDate" style="width: 100%; box-sizing: border-box;">
        </div>
        <div class="modal-actions">
            <button class="btn btn-muted" onclick="closePlantingModal()">Zrušit</button>
            <button class="btn btn-secondary" onclick="savePlantingDate()">Uložit datum</button>
        </div>
    </div>
</div>

<script>
    // ==========================================================
    // --- THING_SPEAK HISTORICAL FETCH & DATA HANDLING ---------
    // ==========================================================
    const CHANNEL_ID = "3394684"; 
    let globalFeedsCache = []; 
    let rawDateStrings = []; 

    const FILTER_SETTINGS = {
        temp:  { min: -20, max: 55,  maxDelta: 3.0 },  
        hum:   { min: 1,   max: 100, maxDelta: 12.0 }, 
        light: { min: 0,   max: 100, transientWindowMs: 6 * 60 * 1000 },
        soil:  { min: 1,   max: 100, smoothWindowSize: 5 }
    };

    const dayBandsPlugin = {
        id: 'dayBands',
        beforeDraw: (chart) => {
            const { ctx, chartArea, scales: { x } } = chart;
            if (!x || !chartArea || rawDateStrings.length === 0) return;

            ctx.save();
            let daysGroups = [];
            let currentDayStr = rawDateStrings[0];
            let startIndex = 0;

            for (let i = 1; i < rawDateStrings.length; i++) {
                if (rawDateStrings[i] !== currentDayStr) {
                    daysGroups.push({ day: currentDayStr, start: startIndex, end: i - 1 });
                    currentDayStr = rawDateStrings[i];
                    startIndex = i;
                }
            }
            daysGroups.push({ day: currentDayStr, start: startIndex, end: rawDateStrings.length - 1 });

            const colors = ['rgba(2, 132, 199, 0.08)', 'rgba(245, 158, 11, 0.05)'];

            daysGroups.forEach((group, index) => {
                let left = x.getPixelForValue(group.start);
                let right = x.getPixelForValue(group.end);
                
                const renderLeft = Math.max(left, chartArea.left);
                const renderRight = Math.min(right, chartArea.right);

                if (renderLeft < renderRight) {
                    ctx.fillStyle = colors[index % colors.length];
                    ctx.fillRect(renderLeft, chartArea.top, renderRight - renderLeft, chartArea.bottom - chartArea.top);
                }

                if (index < daysGroups.length - 1) {
                    ctx.strokeStyle = 'rgba(15, 23, 42, 0.2)';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(right, chartArea.top);
                    ctx.lineTo(right, chartArea.bottom);
                    ctx.stroke();
                }

                ctx.font = 'bold 11px sans-serif';
                ctx.textAlign = 'left';

                if (left >= chartArea.left && left <= chartArea.right) {
                    if (chartArea.right - left > 55) {
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                        ctx.fillRect(left + 4, chartArea.top + 4, 48, 18);
                        ctx.fillStyle = '#0f172a';
                        ctx.fillText(group.day, left + 8, chartArea.top + 17);
                    }
                } else if (left < chartArea.left && right > chartArea.left) {
                    if (right - chartArea.left > 55) {
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                        ctx.fillRect(chartArea.left + 4, chartArea.top + 4, 48, 18);
                        ctx.fillStyle = '#0f172a';
                        ctx.fillText(group.day, chartArea.left + 8, chartArea.top + 17);
                    }
                }
            });
            ctx.restore();
        }
    };

    const chartCtx = document.getElementById('cloudChart').getContext('2d');
    const chartObj = new Chart(chartCtx, {
        type: 'line',
        plugins: [dayBandsPlugin], 
        data: { labels: [], datasets: [
            { 
                label: 'Teplota (°C)', 
                data: [], 
                borderColor: '#ef4444', 
                backgroundColor: 'rgba(239,68,68,0.04)', 
                yAxisID: 'yTemp',
                tension: 0.25, 
                pointRadius: window.innerWidth < 768 ? 0.5 : 1.5,
                pointHoverRadius: 6,
                spanGaps: true 
            },
            { 
                label: 'Vlhkost vzduchu (%)', 
                data: [], 
                borderColor: '#2563eb', 
                backgroundColor: 'rgba(37,99,235,0.02)', 
                yAxisID: 'yHumLight',
                tension: 0.25, 
                pointRadius: window.innerWidth < 768 ? 0.5 : 1.5,
                pointHoverRadius: 6,
                spanGaps: true
            },
            { 
                label: 'Osvětlení (%)', 
                data: [], 
                borderColor: '#d97706', 
                backgroundColor: 'rgba(217,119,6,0.02)', 
                yAxisID: 'yHumLight',
                tension: 0.25, 
                pointRadius: window.innerWidth < 768 ? 0.5 : 1.5,
                pointHoverRadius: 6,
                spanGaps: true
            },
            { 
                label: 'Vlhkost půdy (%)', 
                data: [], 
                borderColor: '#10b981', 
                backgroundColor: 'rgba(16,185,129,0.02)', 
                yAxisID: 'yHumLight',
                tension: 0.25, 
                pointRadius: window.innerWidth < 768 ? 0.5 : 1.5,
                pointHoverRadius: 6,
                spanGaps: true
            }
        ]},
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            scales: {
                x: { 
                    ticks: { color: '#0f172a', maxRotation: 0, autoSkip: true, maxTicksLimit: window.innerWidth < 768 ? 4 : 10 },
                    title: { display: window.innerWidth >= 768, text: 'Čas Záznamu', color: '#0f172a' },
                    grid: { display: false }
                },
                yTemp: { 
                    type: 'linear', 
                    position: 'left', 
                    ticks: { color: '#0f172a' },
                    title: { display: window.innerWidth >= 768, text: 'Teplota (°C)', color: '#0f172a' },
                    min: 0, max: 50,
                    grid: { color: 'rgba(15,23,42,0.18)' }
                },
                yHumLight: { 
                    type: 'linear', 
                    position: 'right', 
                    ticks: { color: '#0f172a' },
                    title: { display: window.innerWidth >= 768, text: 'Vlhkost / Světlo / Půda (%)', color: '#0f172a' },
                    min: 0, max: 100, 
                    grid: { drawOnChartArea: false } 
                }
            },
            plugins: {
                legend: { labels: { color: '#0f172a', boxWidth: window.innerWidth < 768 ? 10 : 40, font: { size: window.innerWidth < 768 ? 10 : 12 } } },
                zoom: {
                    pan: { enabled: true, mode: 'x' },
                    zoom: { wheel: { enabled: true, modifierKey: 'ctrl' }, pinch: { enabled: true }, mode: 'x' }
                },
                tooltip: { backgroundColor: 'rgba(255, 255, 255, 0.95)', titleColor: '#0f172a', bodyColor: '#334155', padding: 10, bodySpacing: 5, cornerRadius: 6, borderWidth: 1, borderColor: 'rgba(15,23,42,0.15)' }
            }
        }
    });

    async function loadCloudData(daysParam = 7) {
        try {
            const response = await fetch(`https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json?days=${daysParam}`);
            const data = await response.json();
            
            if (data.feeds && data.feeds.length > 0) {
                globalFeedsCache = data.feeds;
                
                if (!document.getElementById('startDate').value || daysParam === 7) {
                    const lastDate = new Date(globalFeedsCache[globalFeedsCache.length - 1].created_at);
                    const defaultStartDate = new Date(lastDate.getTime() - (3 * 24 * 60 * 60 * 1000));
                    
                    document.getElementById('startDate').value = formatToDateTimeLocal(defaultStartDate);
                    document.getElementById('endDate').value = formatToDateTimeLocal(lastDate);
                }

                filterAndRenderData();
                updateLiveBoxes(globalFeedsCache[globalFeedsCache.length - 1]);
            }
        } catch (err) {
            console.error("Failed to load historical data window:", err);
        }
    }

    function setQuickRange(days) {
        const now = new Date();
        const pastDate = new Date(now.getTime() - (days * 24 * 60 * 60 * 1000));
        document.getElementById('startDate').value = formatToDateTimeLocal(pastDate);
        document.getElementById('endDate').value = formatToDateTimeLocal(now);
        filterAndRenderData();
    }

    function filterAndRenderData() {
        const startVal = document.getElementById('startDate').value;
        const endVal = document.getElementById('endDate').value;
        const startTimestamp = startVal ? new Date(startVal).getTime() : 0;
        const endTimestamp = endVal ? new Date(endVal).getTime() : Infinity;

        const labels = []; const temps = []; const hums = []; const lights = []; const soils = [];
        rawDateStrings = []; 

        let lastValidT = null;
        let lastValidH = null;
        let lastValidL = 100.0; 
        let lastValidS = null;
        
        let soilHistoryBuffer = [];

        let selectedIndices = [];
        for (let i = 0; i < globalFeedsCache.length; i++) {
            const feedTime = new Date(globalFeedsCache[i].created_at).getTime();
            if (feedTime >= startTimestamp && feedTime <= endTimestamp) {
                selectedIndices.push(i);
            }
        }

        for (let idx = 0; idx < selectedIndices.length; idx++) {
            const cacheIndex = selectedIndices[idx];
            const feed = globalFeedsCache[cacheIndex];
            
            const dateObj = new Date(feed.created_at);
            const timeLabel = dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            const dayLabel = dateObj.toLocaleDateString([], {day: '2-digit', month: '2-digit'}) + '.';
            
            let rawT = feed.field1 ? parseFloat(feed.field1) : null;
            let rawH = feed.field2 ? parseFloat(feed.field2) : null;
            let rawL = feed.field3 ? parseFloat(feed.field3) : null;
            let rawS = feed.field4 ? parseFloat(feed.field4) : null;

            if (rawT !== null) {
                if (rawT < FILTER_SETTINGS.temp.min || rawT > FILTER_SETTINGS.temp.max) {
                    rawT = null; 
                } else if (lastValidT !== null && Math.abs(rawT - lastValidT) > FILTER_SETTINGS.temp.maxDelta) {
                    rawT = null; 
                } else {
                    lastValidT = rawT;
                }
            }

            if (rawH !== null) {
                if (rawH >= 49.5 && rawH <= 50.5) {
                    let prevH = null; let nextH = null;

                    const startP = cacheIndex - 1;
                    const minP = Math.max(0, cacheIndex - 30);
                    for (let p = startP; p >= minP; p--) {
                        if (globalFeedsCache[p].field2) {
                            let val = parseFloat(globalFeedsCache[p].field2);
                            if (val < 49.5 || val > 50.5) { prevH = val; break; }
                        }
                    }
                    const startN = cacheIndex + 1;
                    const maxN = Math.min(globalFeedsCache.length, cacheIndex + 30);
                    for (let n = startN; n < maxN; n++) {
                        if (globalFeedsCache[n].field2) {
                            let val = parseFloat(globalFeedsCache[n].field2);
                            if (val < 49.5 || val > 50.5) { nextH = val; break; }
                        }
                    }

                    if (prevH !== null && nextH !== null) {
                        if (Math.abs(rawH - prevH) > 3.0 && Math.abs(rawH - nextH) > 3.0) {
                            rawH = null; 
                        }
                    }
                }

                if (rawH !== null) {
                    if (rawH < FILTER_SETTINGS.hum.min || rawH > FILTER_SETTINGS.hum.max) {
                        rawH = null;
                    } else if (lastValidH !== null && Math.abs(rawH - lastValidH) > FILTER_SETTINGS.hum.maxDelta) {
                        rawH = null;
                    } else {
                        lastValidH = rawH;
                    }
                }
            }

            if (rawL !== null) {
                if (rawL < FILTER_SETTINGS.light.min || rawL > FILTER_SETTINGS.light.max) {
                    rawL = lastValidL; 
                } else if (rawL < 30.0 && lastValidL > 70.0) {
                    let isTransientDrop = false;
                    
                    const maxJ = Math.min(globalFeedsCache.length, cacheIndex + 12);
                    for (let j = cacheIndex + 1; j < maxJ; j++) {
                        const futureFeed = globalFeedsCache[j];
                        const futureTime = new Date(futureFeed.created_at).getTime();
                        
                        if (futureTime - dateObj.getTime() > FILTER_SETTINGS.light.transientWindowMs) {
                            break;
                        }
                        
                        let futureL = futureFeed.field3 ? parseFloat(futureFeed.field3) : null;
                        if (futureL !== null && futureL > 70.0) {
                            isTransientDrop = true; 
                            break;
                        }
                    }

                    if (isTransientDrop) { rawL = lastValidL; } else { lastValidL = rawL; }
                } else { lastValidL = rawL; }
            } else { rawL = lastValidL; }

            if (rawS !== null) {
                if (rawS < FILTER_SETTINGS.soil.min || rawS > FILTER_SETTINGS.soil.max) {
                    rawS = lastValidS; 
                } else { lastValidS = rawS; }
            } else { rawS = lastValidS; }

            if (rawS !== null) {
                soilHistoryBuffer.push(rawS);
                if (soilHistoryBuffer.length > FILTER_SETTINGS.soil.smoothWindowSize) {
                    soilHistoryBuffer.shift();
                }
                const sum = soilHistoryBuffer.reduce((a, b) => a + b, 0);
                rawS = sum / soilHistoryBuffer.length;
            }

            labels.push(timeLabel);
            rawDateStrings.push(dayLabel);
            temps.push(rawT);
            hums.push(rawH);
            lights.push(rawL);
            soils.push(rawS);
        }

        chartObj.data.labels = labels;
        chartObj.data.datasets[0].data = temps;
        chartObj.data.datasets[1].data = hums;
        chartObj.data.datasets[2].data = lights;
        chartObj.data.datasets[3].data = soils;
        chartObj.update('none');

        recalculateIntervalStatistics(temps, hums);
    }

    function recalculateIntervalStatistics(temps, hums) {
        const cleanT = temps.filter(v => v !== null);
        const cleanH = hums.filter(v => v !== null);

        const updateBlock = (idMin, idAvg, idMax, data, suffix) => {
            if (data.length === 0) {
                document.getElementById(idMin).innerText = `-- ${suffix}`;
                document.getElementById(idAvg).innerText = `-- ${suffix}`;
                document.getElementById(idMax).innerText = `-- ${suffix}`;
                return;
            }
            const min = Math.min(...data);
            const max = Math.max(...data);
            const avg = data.reduce((a, b) => a + b, 0) / data.length;

            document.getElementById(idMin).innerText = `${min.toFixed(1)} ${suffix}`;
            document.getElementById(idAvg).innerText = `${avg.toFixed(1)} ${suffix}`;
            document.getElementById(idMax).innerText = `${max.toFixed(1)} ${suffix}`;
        };

        updateBlock('stat-min-temp', 'stat-avg-temp', 'stat-max-temp', cleanT, '°C');
        updateBlock('stat-min-hum', 'stat-avg-hum', 'stat-max-hum', cleanH, '%');
    }

    function formatToDateTimeLocal(date) {
        const pad = num => String(num).padStart(2, '0');
        return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
    }

    function updateLiveBoxes(latestFeed) {
        if (!latestFeed) return;
        const currentT = latestFeed.field1 ? parseFloat(latestFeed.field1).toFixed(1) : "--";
        const currentH = latestFeed.field2 ? parseFloat(latestFeed.field2).toFixed(1) : "--";
        const currentL = latestFeed.field3 ? parseFloat(latestFeed.field3).toFixed(0) : "--";
        
        const dataset = chartObj.data.datasets[3].data;
        const lastSmoothedSoil = dataset.length > 0 ? dataset[dataset.length - 1] : null;
        const currentS = (lastSmoothedSoil !== null && !isNaN(lastSmoothedSoil)) ? lastSmoothedSoil.toFixed(1) : "--";

        document.getElementById('live-temp').innerText = `${currentT} °C`;
        document.getElementById('live-hum').innerText = `${currentH} %`;
        document.getElementById('live-light').innerText = `${currentL} %`;
        document.getElementById('live-soil').innerText = `${currentS} %`;
    }

    function resetDateFilters() { loadCloudData(7); }

    function openPlantingModal() {
        const savedDate = localStorage.getItem('plantSeedDate');
        if (savedDate) {
            document.getElementById('seedPlantDate').value = savedDate;
        } else {
            const today = new Date();
            document.getElementById('seedPlantDate').value = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
        }
        document.getElementById('plantingModal').style.display = 'flex';
    }

    function closePlantingModal() { document.getElementById('plantingModal').style.display = 'none'; }

    function savePlantingDate() {
        const dateValue = document.getElementById('seedPlantDate').value;
        if (dateValue) {
            localStorage.setItem('plantSeedDate', dateValue);
            calculatePlantGrowthDays();
            closePlantingModal();
        }
    }

    function calculatePlantGrowthDays() {
        const savedDateStr = localStorage.getItem('plantSeedDate');
        const valueBox = document.getElementById('live-plant-days');
        const weeksBox = document.getElementById('live-plant-weeks');
        const subvalueBox = document.getElementById('live-plant-total');

        if (!savedDateStr) {
            valueBox.innerText = "Nenastaveno";
            weeksBox.style.display = "none";
            subvalueBox.innerText = "Kliknutím zadejte datum výsevu";
            return;
        }

        const plantingDate = new Date(savedDateStr + 'T00:00:00');
        const today = new Date(); today.setHours(0,0,0,0);
        const diffDays = Math.floor((today.getTime() - plantingDate.getTime()) / (1000 * 60 * 60 * 24));

        if (diffDays < 0) {
            valueBox.innerText = "Naplánováno";
            weeksBox.style.display = "none";
            subvalueBox.innerText = `Začíná za ${Math.abs(diffDays)} dní`;
        } else if (diffDays === 0) {
            valueBox.innerText = "Den 0";
            weeksBox.style.display = "inline-block";
            weeksBox.innerText = "0. týden";
            subvalueBox.innerText = "Zasazeno dnes!";
        } else {
            valueBox.innerText = `Den ${diffDays} (${getCzechDayDeclension(diffDays)})`;
            weeksBox.style.display = "inline-block";
            weeksBox.innerText = `${Math.floor(diffDays / 7) + 1}. týden`;
            subvalueBox.innerText = "";
        }
    }

    function getCzechDayDeclension(days) {
        if (days === 1) return "den";
        if (days >= 2 && days <= 4) return "dny";
        return "dní";
    }

    function resetGraphZoom() { chartObj.resetZoom(); }

    calculatePlantGrowthDays();
    loadCloudData();
    
    setInterval(() => loadCloudData(7), 60000); 

    // ==========================================================
    // --- OPTIMIZED WEBGL SIMPLEX ENGINE WITH STREAK MONITOR ---
    // ==========================================================
    const topoCanvas = document.getElementById('topoCanvas');
    const gl = topoCanvas.getContext('webgl2', { alpha: false, failIfMajorPerformanceCaveat: true });

    let stopShaderEngine = false;

    if (!gl) { 
        console.warn("WebGL2 execution context failed initialization.");
        disableBackgroundEngine();
    }

    const quadVS = `#version 300 es
        void main() {
            vec2 pos[4] = vec2[](vec2(-1.0,-1.0), vec2(1.0,-1.0), vec2(-1.0,1.0), vec2(1.0,1.0));
            gl_Position = vec4(pos[gl_VertexID], 0.0, 1.0);
        }`;

    const topoFS = `#version 300 es
        precision highp float;
        uniform float u_time;
        uniform vec2 u_resolution;
        out vec4 fragColor;
        #define iTime u_time
        #define iResolution u_resolution

        vec2 hash( vec2 p ) {
            p = vec2( dot(p,vec2(127.1,311.7)), dot(p,vec2(269.5,183.3)) );
            return -1.0 + 2.0*fract(sin(p)*43758.5453123);
        }
        float noise( in vec2 p ) {
            const float K1 = 0.366025404; const float K2 = 0.211324865;
            vec2 i = floor( p + (p.x+p.y)*K1 ); vec2 a = p - i + (i.x+i.y)*K2;
            float m = step(a.y,a.x); vec2 o = vec2(m,1.0-m);
            vec2 b = a - o + K2; vec2 c = a - 1.0 + 2.0*K2;
            vec3 h = max( 0.5-vec3(dot(a,a), dot(b,b), dot(c,c) ), 0.0 );
            vec3 n = h*h*h*h*vec3( dot(a,hash(i+0.0)), dot(b,hash(i+o)), dot(c,hash(i+1.0)));
            return dot( n, vec3(70.0) );
        }
        float maximum(vec3 p) { float m = p.x; if (p.y > m) m = p.y; if (p.z > m) m = p.z; return m; }
        float minimum(vec3 p) { float m = p.x; if (p.y < m) m = p.y; if (p.z < m) m = p.z; return m; }
        vec3 normalize2 (vec3 grosscolor) {
            grosscolor = (grosscolor*grosscolor*grosscolor);
            return (grosscolor.xyz/(maximum(grosscolor)+minimum(grosscolor)));
        }
        vec2 rotate (vec2 oldpoint, float angle) {
            return vec2(cos(angle)*oldpoint.x - sin(angle)*oldpoint.y, sin(angle)*oldpoint.x + cos(angle)*oldpoint.y);
        }
        float noise4( vec2 uv ) {
            float f = 0.5; float frequency = 1.75; float amplitude = 0.5;
            for(int i = 0; i < 4; i++){
                f += amplitude*noise( frequency*uv - rotate(vec2(log(iTime+3.0),log(iTime+3.0)/999.0),iTime/9999.0) );
                frequency *= 2.0; amplitude *= 0.5;
            }
            return f;
        }
        void main() {
            vec2 p = gl_FragCoord.xy / iResolution.xy;
            vec2 uv = p*vec2(iResolution.x/iResolution.y,0.8);
            uv = rotate(uv,log(iTime)/-7.0);
            float interval = 10.0;
            vec3 dblue = interval*vec3(1.8,2.6,2.6); vec3 cyan = interval*vec3(0,2.1,2); vec3 magenta = interval*vec3(1.8,1.0,1.8);
            float f = 0.0; vec3 color = vec3(0.75,0.75,0.75);   
            f = noise4( uv + noise4(uv)*((log(iTime+1.0)+(iTime/60.0))) ); color += f*normalize2(dblue);
            f = noise4( f*rotate(uv,sin(iTime/11.0)) + f*noise4(f*uv)); color += f*normalize2(cyan);
            f = noise4( f*rotate(uv,iTime/7.0) + f*noise4(uv)*noise4(uv)); color += f*normalize2(magenta);
            fragColor = vec4(normalize2(color), 1.0);
        }`;

    function compileShaderSource(type, src) {
        if(stopShaderEngine) return null;
        const shader = gl.createShader(type);
        gl.shaderSource(shader, src); gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
            gl.deleteShader(shader); return null;
        }
        return shader;
    }

    let vertexShader, fragmentShader, renderProgram, timeLoc, resLoc;
    if(!stopShaderEngine) {
        vertexShader = compileShaderSource(gl.VERTEX_SHADER, quadVS);
        fragmentShader = compileShaderSource(gl.FRAGMENT_SHADER, topoFS);
        renderProgram = gl.createProgram();
        gl.attachShader(renderProgram, vertexShader);
        gl.attachShader(renderProgram, fragmentShader);
        gl.linkProgram(renderProgram);
        timeLoc = gl.getUniformLocation(renderProgram, "u_time");
        resLoc = gl.getUniformLocation(renderProgram, "u_resolution");
    }

    function syncCanvasViewport() {
        if(stopShaderEngine) return;
        const renderScale = window.innerWidth < 768 ? 0.5 : 0.75; 
        topoCanvas.width = window.innerWidth * renderScale;
        topoCanvas.height = window.innerHeight * renderScale;
        if(gl) gl.viewport(0, 0, topoCanvas.width, topoCanvas.height);
    }
    window.addEventListener('resize', syncCanvasViewport);
    syncCanvasViewport();

    const renderLoopStart = performance.now();
    let lastFrameTime = performance.now();
    
    let slowFrameStreakCount = 0;
    const MAX_ALLOWED_SLOW_STREAK = 60; 
    const TIME_LIMIT_PER_FRAME = 1000 / 45; 

    function drawTopography() {
        if (stopShaderEngine) return;

        const now = performance.now();
        const deltaFrameTime = now - lastFrameTime;
        lastFrameTime = now;

        if (deltaFrameTime > TIME_LIMIT_PER_FRAME) {
            slowFrameStreakCount++;
            if (slowFrameStreakCount >= MAX_ALLOWED_SLOW_STREAK) {
                console.warn("Target framerate breached across sequential iterations. Forcing safe white canvas mapping.");
                disableBackgroundEngine();
                return;
            }
        } else {
            if (slowFrameStreakCount > 0) slowFrameStreakCount--;
        }

        const timestamp = (now - renderLoopStart) * 0.001;
        gl.useProgram(renderProgram);
        gl.uniform1f(timeLoc, timestamp);
        gl.uniform2f(resLoc, topoCanvas.width, topoCanvas.height);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

        requestAnimationFrame(drawTopography);
    }

    function disableBackgroundEngine() {
        stopShaderEngine = true;
        topoCanvas.style.opacity = '0';
        setTimeout(() => {
            topoCanvas.remove();
            document.querySelectorAll('.card').forEach(card => {
                card.style.background = '#ffffff';
                card.style.boxShadow = '0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06)';
            });
        }, 500);
    }

    if(!stopShaderEngine) {
        drawTopography();
    }
</script>
